    <script>
      (() => {
        try {
          const saved = localStorage.getItem('kabadiwala-theme');
          const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          const theme = saved === 'light' || saved === 'dark' ? saved : (systemDark ? 'dark' : 'light');
          document.documentElement.dataset.theme = theme;
          document.querySelector('meta[name="theme-color"]')?.setAttribute('content', theme === 'dark' ? '#18181b' : '#fafafa');
        } catch (_) {
          document.documentElement.dataset.theme = 'light';
        }
        try {
          const savedLang = localStorage.getItem('kabadiwala-language');
          if (savedLang === 'mr' || savedLang === 'hi' || savedLang === 'en') {
            document.documentElement.lang = savedLang;
          }
        } catch (_) {}
      })();
    </script>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
